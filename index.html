<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cricket 3D PRO</title>
  <style>
    :root { --bg: #071427; --card: #0d1b2a; --gold: #ffc107; --text: #e8eef5; }
    body { margin: 0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { color: var(--gold); letter-spacing: 2px; margin: 0 0 8px; }
    .card { background: var(--card); border: 1px solid #ffffff22; border-radius: 16px; padding: 24px; margin-top: 24px; }
    a { color: var(--gold); }
  </style>
</head>
<body>
<main>
  <h1>CRICKET 3D PRO</h1>
  <p>A fast, realistic 3D cricket game for Android: hold to power, release to smash sixes, and play a 100-round batting career across eight stadiums.</p>
  <div class="card">
    <p><a href="https://play.google.com/store/apps/details?id=com.cricket3d.championship">Get it on Google Play</a></p>
    <p><a href="privacy-policy.html">Privacy Policy</a></p>
  </div>
</main>
</body>
</html>
